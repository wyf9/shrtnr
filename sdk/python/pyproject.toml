[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wshrtnr"
version = "3.0.0"
description = "SDK for the shrtnr URL shortener API"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
authors = [{ name = "Oddbit", email = "hello@oddbit.id" }, { name = "wyf9", email = "wyf9@wyf9.top"}]
keywords = [
  "url-shortener",
  "link-shortener",
  "short-url",
  "shorten-url",
  "shrtnr",
  "cloudflare-workers",
  "cloudflare-d1",
  "sdk",
  "python",
  "link-management",
  "click-analytics",
  "custom-slug",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.28",
]

[project.urls]
Homepage = "https://shrtnr.p.wyf9.top"
Repository = "https://github.com/wyf9/shrtnr"
Changelog = "https://github.com/wyf9/shrtnr/blob/main/sdk/python/CHANGELOG.md"
Issues = "https://github.com/wyf9/shrtnr/issues"

[project.optional-dependencies]
dev = [
  "pytest>=9",
  "pytest-asyncio>=1.3",
  "respx>=0.23",
  "ty>=0.0.60",
  "ruff>=0.15",
]

pytest = [
  "pytest>=9",
  "pytest-asyncio>=1.3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/wshrtnr"]

[tool.hatch.build.targets.wheel.force-include]
"TRADEMARK_POLICY.md" = "wshrtnr/TRADEMARK_POLICY.md"

[tool.hatch.build.targets.sdist]
include = [
  "src/wshrtnr",
  "README.md",
  "CHANGELOG.md",
  "LICENSE",
  "NOTICE",
  "TRADEMARK_POLICY.md",
  "pyproject.toml",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["wshrtnr"]

[tool.ty]
python_version = "3.10"
strict = true

[tool.shrtnr]
spec_hash = "sha256:b5f8703db1545f5187fefd3f522d956706ff7e767a3f776c8880e4189487c223"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Default `pytest` runs unit tests only. E2e tests need a live shrtnr server
# and are opt-in via `pytest -m e2e` — the scripts/test-sdks-e2e.sh harness
# spins up wrangler dev, mints an API key, and runs them for real.
addopts = "-m 'not e2e'"
markers = [
  "e2e: end-to-end tests that hit a real wrangler dev server (set SHRTNR_TEST_URL + SHRTNR_TEST_API_KEY)",
]
